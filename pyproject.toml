[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py6sigma"
version = "0.1.0"
description = "Lean Six Sigma statistical analysis tools for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "openpyxl>=3.1.5",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
py6sigma = "py6sigma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
